services:
  cli-proxy-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CLI_PROXY_CONFIG_B64: ${CLI_PROXY_CONFIG_B64:?CLI_PROXY_CONFIG_B64 is required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "100.97.133.20:8317:8317"
    volumes:
      - cliproxy-auths:/var/lib/cliproxy/auths
    restart: unless-stopped

volumes:
  cliproxy-auths:
